[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proteus"
version = "0.1.0"
description = "Local, privacy-first document-format converter (CLI + Windows right-click menu)"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "typer>=0.15",
    "rich>=13",
    "pydantic>=2",
    "pdf2docx>=0.5",
    "pymupdf>=1.24",
]

[[project.authors]]
name = "Ralf090102"
email = "ralf.hernandez090102@gmail.com"

[project.scripts]
proteus = "proteus.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "python-docx>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
# _FakeWinreg's method names deliberately mirror the real winreg module's
# API (CreateKeyEx, SetValueEx, ...) so it can stand in for it in tests.
"tests/unit/test_context_menu.py" = ["N802"]

[tool.pytest.ini_options]
markers = [
    "integration: requires real Pandoc/LibreOffice on PATH (opt-in, `pytest -m integration`)",
]
addopts = "-m 'not integration'"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
