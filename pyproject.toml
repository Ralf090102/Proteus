[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proteus"
version = "0.1.0"
description = "Local, privacy-first document-format converter (CLI + Windows right-click menu)"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "typer>=0.15",
    "rich>=13",
    "pydantic>=2",
    "pdf2docx>=0.5",
    "pymupdf>=1.24",
]

[[project.authors]]
name = "Ralf090102"
email = "ralf.hernandez090102@gmail.com"

[project.scripts]
proteus = "proteus.cli:main"

[project.gui-scripts]
# Same entry point, windowed subsystem — used only for context-menu-launched
# conversions (see windows/context_menu.py) so Explorer doesn't flash a
# console window. Direct terminal use always goes through `proteus` above.
proteus-gui = "proteus.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "python-docx>=1.1",
]
# png/jpg/webp conversion (converters/image.py) — deliberately optional,
# not a base dependency: install via `uv tool install .[images]`. Floor
# is recent enough that prebuilt wheels bundle libwebp, so no separate
# system WebP library install is needed.
images = [
    "Pillow>=10",
]
# pdf->md conversion (converters/pdf_extract.py:PdfToMarkdownConverter) —
# deliberately optional, not a base dependency, unlike pdf2docx/pymupdf:
# pymupdf4llm pulls in a much heavier transitive footprint (an ONNX layout
# model + onnxruntime + networkx, ~55MB) for a feature whose value is a
# spike judgment call, not a core-pair certainty. Install via
# `uv tool install .[markdown]`.
markdown = [
    "pymupdf4llm>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "python-docx>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
# _FakeWinreg's method names deliberately mirror the real winreg module's
# API (CreateKeyEx, SetValueEx, ...) so it can stand in for it in tests.
"tests/unit/test_context_menu.py" = ["N802"]

[tool.pytest.ini_options]
markers = [
    "integration: requires real Pandoc/LibreOffice on PATH (opt-in, `pytest -m integration`)",
]
addopts = "-m 'not integration'"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
